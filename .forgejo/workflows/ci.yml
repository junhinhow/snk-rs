name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: fmt, clippy and tests
    runs-on: docker
    container:
      image: rust:latest
    steps:
      - uses: code.forgejo.org/actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run the tests
        run: cargo test --all-features

  build:
    name: build
    runs-on: docker
    container:
      image: rust:latest
    steps:
      - uses: code.forgejo.org/actions/checkout@v4

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Generate a snake to prove the tool works
        run: |
          cargo run --release -- \
            --user octocat \
            --palette github-dark \
            --color-snake "#16A34A" \
            --output smoke-test.svg
          test -s smoke-test.svg
          grep -q "<svg" smoke-test.svg
