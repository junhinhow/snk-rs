name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    # Only real tags produce a release. A push to a branch must never build
    # binaries, otherwise every commit would spawn three runners.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: snk-rs-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: snk-rs-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: snk-rs-macos-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/snk-rs${{ matrix.name | endswith('.exe') && '.exe' || '' }}" "dist/${{ matrix.name }}"
          if [[ "${{ matrix.name }}" == *.exe ]]; then
            cd dist && zip "${{ matrix.name }}.zip" "${{ matrix.name }}"
          else
            cd dist && tar czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
